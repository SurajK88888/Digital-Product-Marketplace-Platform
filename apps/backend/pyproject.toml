[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "marketplace-backend"
version = "1.0.0"
description = "Enterprise-grade Digital Product Marketplace — FastAPI Backend"
requires-python = ">=3.12"

# ── Ruff: Linting & Formatting (replaces Flake8 + isort + Black) ──
[tool.ruff]
target-version = "py312"
line-length = 100
fix = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "N",   # pep8-naming
    "S",   # flake8-bandit (security)
    "ANN", # flake8-annotations
]
ignore = [
    "ANN101", # Missing type annotation for self
    "ANN102", # Missing type annotation for cls
    "S101",   # Use of assert (allowed in tests)
    "B008",   # Do not perform function calls in default arguments (FastAPI Depends)
    "N818",   # Custom exception names using *Exception suffix
    "ANN401", # Allow typing.Any for logger and dynamic schemas
    "S105",   # Allow TOKEN_TYPE string constants in security.py
    "ARG001", # Allow unused arguments (e.g. app in FastAPI lifespan)
    "S104",   # Allow binding to 0.0.0.0 in dev server run
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN"]
"alembic/**" = ["ANN"]

[tool.ruff.lint.isort]
known-third-party = ["fastapi", "pydantic", "sqlalchemy"]
force-sort-within-sections = true

# ── Mypy: Static Type Checking ────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["passlib.*", "jose.*", "celery.*", "aiobotocore.*"]
ignore_missing_imports = true

# ── Pytest Configuration ──────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

# ── Coverage ─────────────────────────────────────────────────
[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*", "main.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
