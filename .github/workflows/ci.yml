# =============================================================
# .github/workflows/ci.yml — Continuous Integration Pipeline
# Runs on: every push and pull request
# Jobs: Frontend (lint, type-check) | Backend (lint, type-check, tests) | Security scan
# =============================================================

name: CI — Lint, Type-Check, Test & Security

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"

jobs:
  # ── Frontend: Lint & Type-Check ─────────────────────────────
  frontend-quality:
    name: "Frontend — Lint & Type-Check"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type-check
        run: npm run type-check

      - name: Check Prettier formatting
        run: npm run format:check

  # ── Backend: Lint, Type-Check, Tests ─────────────────────────
  backend-quality:
    name: "Backend — Lint, Type-Check & Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_marketplace_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "apps/backend/requirements.txt"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Ruff formatter check
        run: ruff format --check .

      - name: Run Mypy type-checking
        run: mypy app/
        env:
          # Provide minimal env vars for settings validation during type-check
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_marketplace_db
          SECRET_KEY: ci-test-secret-key-not-used-in-production-64chars-minimum-length
          ENVIRONMENT: development

      - name: Run Pytest with coverage
        run: |
          pip install pytest pytest-asyncio pytest-cov
          pytest --cov=app --cov-report=xml --cov-report=term-missing -v
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_marketplace_db
          SECRET_KEY: ci-test-secret-key-not-used-in-production-64chars-minimum-length
          ENVIRONMENT: development

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: success()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/backend/coverage.xml
          flags: backend

  # ── Security: Dependency & Container Scanning ────────────────
  security-scan:
    name: "Security — Dependency & Container Scan"
    runs-on: ubuntu-latest
    needs: [frontend-quality, backend-quality]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies (frontend)
        run: npm ci

      - name: Run npm audit (frontend)
        run: npm audit --audit-level=high
        working-directory: apps/frontend
        continue-on-error: true  # Report but don't block on moderate vulnerabilities

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run pip-audit (backend)
        run: |
          pip install pip-audit
          pip-audit -r apps/backend/requirements.txt --desc
        continue-on-error: true

      - name: Run Trivy vulnerability scanner (repository)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  # ── CI Gate: All checks must pass ─────────────────────────────
  ci-gate:
    name: "CI Gate — All Checks Passed"
    runs-on: ubuntu-latest
    needs: [frontend-quality, backend-quality, security-scan]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.frontend-quality.result }}" != "success" ]] || \
             [[ "${{ needs.backend-quality.result }}" != "success" ]]; then
            echo "❌ CI Gate failed — required checks did not pass"
            exit 1
          fi
          echo "✅ CI Gate passed — all required checks succeeded"
